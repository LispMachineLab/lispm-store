name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog, Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Check
        run: make check

  install:
    name: Install and try, Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The agents whose roles and skills these are, from their own repository.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .deps/lispm-agent
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test LISPM_AGENT=.deps/lispm-agent/lisp
