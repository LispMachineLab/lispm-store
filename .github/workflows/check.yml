name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog, Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # LispM Desktop, whose rules for apps and extensions the check applies.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-desktop
          path: .deps/lispm-desktop
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Check
        run: make check LISPM_DESKTOP=.deps/lispm-desktop/lisp

  install:
    name: Install and try, Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The agents whose roles and skills these are, and the desktop the
      # extensions extend, from their own repositories.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .deps/lispm-agent
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-desktop
          path: .deps/lispm-desktop
      # LispM UI, the library the agents are drawn with.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .deps/lispm-ui
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test LISPM_AGENT=.deps/lispm-agent/lisp LISPM_DESKTOP=.deps/lispm-desktop/lisp LISPM_UI=.deps/lispm-ui
